<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 56" width="32" height="56">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="30%" stop-color="#16A34A"/>
      <stop offset="70%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="25%" stop-color="#15803D"/>
      <stop offset="70%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="potConcrete" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="16" cy="53" rx="10" ry="3" fill="#090D14" opacity="0.4"/>

  <!-- Tall Snake Plant Sword Leaves (Variegated Green with Yellow Edges) -->
  <!-- Leaf 1 (Left Back) -->
  <path d="M 12,38 Q 6,20 10,4 Q 14,20 14,38 Z" fill="url(#leafGrad1)"/>
  <!-- Leaf 2 (Right Back) -->
  <path d="M 18,38 Q 24,18 20,6 Q 16,18 16,38 Z" fill="url(#leafGrad2)"/>
  <!-- Leaf 3 (Center Tallest Leaf) -->
  <path d="M 14,38 Q 13,15 16,1 Q 19,15 18,38 Z" fill="url(#leafGrad1)"/>
  <!-- Leaf 4 (Front Left) -->
  <path d="M 10,38 Q 4,26 8,12 Q 13,26 12,38 Z" fill="url(#leafGrad2)"/>
  <!-- Leaf 5 (Front Right) -->
  <path d="M 20,38 Q 26,24 23,10 Q 18,24 18,38 Z" fill="url(#leafGrad1)"/>

  <!-- Modern White/Concrete Cylinder Pot -->
  <rect x="7" y="36" width="18" height="16" rx="2" fill="url(#potConcrete)" stroke="#1E293B" stroke-width="1"/>
  <!-- Pot Top Rim -->
  <ellipse cx="16" cy="36" rx="9" ry="2.5" fill="#334155"/>
  <ellipse cx="16" cy="36" rx="8" ry="1.8" fill="#1C1917"/>
</svg>
