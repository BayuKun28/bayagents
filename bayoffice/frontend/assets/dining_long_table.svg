<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 56" width="150" height="56">
  <defs>
    <!-- Solid Oak / Teak Wood Grain -->
    <linearGradient id="longTableWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="40%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="stoolLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows under Table & Stools -->
  <rect x="10" y="16" width="130" height="32" rx="6" fill="#090D14" opacity="0.35"/>

  <!-- 4 Top Bar Stools (Behind Table) -->
  <!-- Stool 1 -->
  <circle cx="28" cy="8" r="8" fill="url(#stoolLeather)" stroke="url(#chromeRing)" stroke-width="1.5"/>
  <circle cx="28" cy="8" r="5" fill="#334155" opacity="0.5"/>
  <!-- Stool 2 -->
  <circle cx="62" cy="8" r="8" fill="url(#stoolLeather)" stroke="url(#chromeRing)" stroke-width="1.5"/>
  <circle cx="62" cy="8" r="5" fill="#334155" opacity="0.5"/>
  <!-- Stool 3 -->
  <circle cx="96" cy="8" r="8" fill="url(#stoolLeather)" stroke="url(#chromeRing)" stroke-width="1.5"/>
  <circle cx="96" cy="8" r="5" fill="#334155" opacity="0.5"/>
  <!-- Stool 4 -->
  <circle cx="126" cy="8" r="8" fill="url(#stoolLeather)" stroke="url(#chromeRing)" stroke-width="1.5"/>
  <circle cx="126" cy="8" r="5" fill="#334155" opacity="0.5"/>

  <!-- Solid Wood Table Top Surface -->
  <rect x="8" y="14" width="134" height="28" rx="4" fill="url(#longTableWood)" stroke="#451A03" stroke-width="1.5"/>
  <line x1="10" y1="16" x2="140" y2="16" stroke="#B45309" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="28" x2="140" y2="28" stroke="#451A03" stroke-width="0.8" opacity="0.5"/>

  <!-- Items on Dining Table -->
  <!-- 1. Ceramic Fruit Bowl with Apples & Oranges (Center Left) -->
  <ellipse cx="44" cy="27" rx="10" ry="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <circle cx="41" cy="26" r="3.2" fill="#EF4444"/> <!-- Red Apple -->
  <circle cx="47" cy="26" r="3.2" fill="#F97316"/> <!-- Orange -->
  <circle cx="44" cy="24" r="2.8" fill="#84CC16"/> <!-- Green Apple -->

  <!-- 2. Glass Cookie / Biscuit Jar with Cork Lid (Center Right) -->
  <rect x="76" y="21" width="11" height="12" rx="2" fill="#38BDF8" fill-opacity="0.25" stroke="#94A3B8" stroke-width="0.8"/>
  <rect x="77" y="19" width="9" height="3" rx="1" fill="#D97706"/> <!-- Cork Lid -->
  <circle cx="79.5" cy="28" r="2" fill="#B45309"/> <!-- Cookie 1 -->
  <circle cx="83.5" cy="28" r="2" fill="#B45309"/> <!-- Cookie 2 -->
  <circle cx="81.5" cy="24" r="2" fill="#B45309"/> <!-- Cookie 3 -->

  <!-- 3. Cold Drink Glass with Straw (Left End) -->
  <rect x="18" y="22" width="6" height="10" rx="1" fill="#38BDF8" fill-opacity="0.3" stroke="#94A3B8" stroke-width="0.6"/>
  <line x1="20" y1="18" x2="22" y2="30" stroke="#EF4444" stroke-width="1" stroke-linecap="round"/>

  <!-- 4. Stainless Steel Napkin Dispenser (Right End) -->
  <rect x="108" y="21" width="12" height="12" rx="1.5" fill="url(#chromeRing)" stroke="#475569" stroke-width="0.8"/>
  <rect x="110" y="23" width="8" height="8" rx="0.5" fill="#FFFFFF"/>
  <line x1="114" y1="24" x2="114" y2="30" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 5. Mug of Tea / Matcha (Far Right) -->
  <rect x="128" y="23" width="7" height="8" rx="1.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8"/>
  <circle cx="131.5" cy="25" r="2.5" fill="#16A34A"/>
</svg>
