<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 65" width="130" height="65">
  <defs>
    <!-- Mahogany Teak Wood Gradient -->
    <linearGradient id="mahoganyWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#5B2109"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <!-- Leather Pad Gradient -->
    <linearGradient id="leatherPad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <rect x="2" y="8" width="126" height="55" rx="5" fill="#000000" opacity="0.35"/>

  <!-- Solid Wood Desk Surface -->
  <rect x="2" y="6" width="126" height="55" rx="4" fill="url(#mahoganyWood)" stroke="#92400E" stroke-width="2"/>
  <line x1="4" y1="8" x2="126" y2="8" stroke="#B45309" stroke-width="1.2" opacity="0.6"/>

  <!-- Executive Leather Desk Blotter (Tengah) -->
  <rect x="35" y="14" width="60" height="42" rx="3" fill="url(#leatherPad)" stroke="#334155" stroke-width="1.2"/>
  <!-- Gold Stitched Border on Leather -->
  <rect x="37" y="16" width="56" height="38" rx="2" fill="none" stroke="#D97706" stroke-width="0.8" stroke-dasharray="3 1.5"/>

  <!-- Slim Silver Laptop (MacBook Pro style) -->
  <rect x="47" y="18" width="36" height="24" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- Laptop Screen Glow (Analytics / Dashboard) -->
  <rect x="49" y="20" width="32" height="18" rx="1" fill="#0F172A"/>
  <!-- Analytics bar chart on laptop screen -->
  <rect x="52" y="28" width="4" height="8" fill="#38BDF8"/>
  <rect x="58" y="24" width="4" height="12" fill="#10B981"/>
  <rect x="64" y="26" width="4" height="10" fill="#F59E0B"/>
  <rect x="70" y="22" width="4" height="14" fill="#A855F7"/>
  <!-- Laptop Keyboard trackpad hint -->
  <rect x="55" y="39" width="20" height="2" rx="0.5" fill="#CBD5E1"/>

  <!-- Classic Banker's Lamp (Left Corner) -->
  <!-- Brass base -->
  <ellipse cx="18" cy="22" rx="8" ry="4" fill="#B45309" stroke="#78350F" stroke-width="1"/>
  <line x1="18" y1="22" x2="18" y2="14" stroke="#F59E0B" stroke-width="2"/>
  <!-- Emerald Green Glass Shade -->
  <rect x="10" y="11" width="16" height="6" rx="2.5" fill="#065F46" stroke="#047857" stroke-width="1"/>
  <!-- Warm Lamp Light Aura -->
  <ellipse cx="18" cy="26" rx="14" ry="7" fill="#FEF08A" opacity="0.18"/>

  <!-- Executive Document Tray & Papers (Right Corner) -->
  <rect x="102" y="14" width="22" height="28" rx="2" fill="#1C1917" stroke="#44403C" stroke-width="1"/>
  <rect x="104" y="16" width="18" height="24" rx="1" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="107" y1="20" x2="119" y2="20" stroke="#EF4444" stroke-width="1.2"/> <!-- Header -->
  <line x1="107" y1="24" x2="117" y2="24" stroke="#64748B" stroke-width="0.8"/>
  <line x1="107" y1="28" x2="118" y2="28" stroke="#64748B" stroke-width="0.8"/>
  <line x1="107" y1="32" x2="115" y2="32" stroke="#64748B" stroke-width="0.8"/>

  <!-- Gold Pen Holder & Pen -->
  <circle cx="26" cy="46" r="4.5" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <line x1="26" y1="46" x2="30" y2="38" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hot Coffee Porcelain Cup & Saucer -->
  <ellipse cx="109" cy="48" rx="6" ry="3.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <circle cx="109" cy="47" r="3.8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <circle cx="109" cy="47" r="2.8" fill="#78350F"/> <!-- Coffee surface -->
</svg>
