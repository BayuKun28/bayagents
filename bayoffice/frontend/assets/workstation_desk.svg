<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" width="100" height="64">
  <defs>
    <!-- Desk Wood / Matte Surface Gradient -->
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Screen Glass Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="screenGlowRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Desk Surface Shadow -->
  <rect x="2" y="10" width="96" height="52" rx="4" fill="#090D14" opacity="0.4"/>

  <!-- Desk Surface (Table Top) -->
  <rect x="2" y="8" width="96" height="52" rx="4" fill="url(#deskTop)" stroke="#475569" stroke-width="1.5"/>
  <line x1="4" y1="10" x2="96" y2="10" stroke="#64748B" stroke-width="1" opacity="0.6"/>

  <!-- Left Monitor (Code Editor IDE) -->
  <rect x="12" y="12" width="34" height="22" rx="2" fill="#090D16" stroke="#334155" stroke-width="1.2"/>
  <rect x="14" y="14" width="30" height="18" fill="url(#screenGlow)"/>
  <!-- Code lines on left screen -->
  <line x1="16" y1="17" x2="26" y2="17" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="21" x2="38" y2="21" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="19" y1="24" x2="32" y2="24" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="24" y2="28" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Monitor Stand Base -->
  <rect x="26" y="34" width="6" height="3" fill="#1E293B"/>
  <rect x="23" y="36" width="12" height="2" rx="1" fill="#475569"/>

  <!-- Right Monitor (Terminal / Preview) -->
  <rect x="48" y="12" width="34" height="22" rx="2" fill="#090D16" stroke="#334155" stroke-width="1.2"/>
  <rect x="50" y="14" width="30" height="18" fill="url(#screenGlowRight)"/>
  <!-- Terminal prompt on right screen -->
  <circle cx="53" cy="17" r="1" fill="#EF4444"/>
  <circle cx="56" cy="17" r="1" fill="#F59E0B"/>
  <circle cx="59" cy="17" r="1" fill="#10B981"/>
  <line x1="53" y1="22" x2="72" y2="22" stroke="#34D399" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53" y1="26" x2="68" y2="26" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Monitor Stand Base -->
  <rect x="62" y="34" width="6" height="3" fill="#1E293B"/>
  <rect x="59" y="36" width="12" height="2" rx="1" fill="#475569"/>

  <!-- Desktop PC Tower (Corner Right) -->
  <rect x="85" y="12" width="11" height="26" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="90.5" cy="18" r="3" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
  <circle cx="90.5" cy="18" r="1" fill="#38BDF8"/>
  <circle cx="90.5" cy="27" r="3" fill="none" stroke="#A855F7" stroke-width="1.2"/>
  <circle cx="90.5" cy="27" r="1" fill="#A855F7"/>

  <!-- Desk Mat / Mousepad Large -->
  <rect x="22" y="42" width="54" height="15" rx="2" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

  <!-- Mechanical Keyboard -->
  <rect x="26" y="44" width="30" height="10" rx="1.5" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
  <!-- Keycaps row hint -->
  <line x1="28" y1="46.5" x2="54" y2="46.5" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 1"/>
  <line x1="28" y1="49.5" x2="54" y2="49.5" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 1"/>
  <line x1="34" y1="52" x2="48" y2="52" stroke="#F1F5F9" stroke-width="1"/> <!-- Spacebar -->

  <!-- Ergonomic Wireless Mouse -->
  <rect x="63" y="45" width="7" height="9" rx="3.5" fill="#334155" stroke="#64748B" stroke-width="0.8"/>
  <line x1="66.5" y1="45" x2="66.5" y2="48" stroke="#0F172A" stroke-width="0.8"/>

  <!-- Coffee Ceramic Mug -->
  <circle cx="10" cy="46" r="4.5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="10" cy="46" r="3.2" fill="#78350F"/> <!-- Espresso liquid -->
  <path d="M 6 46 A 2 2 0 0 1 6 48" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
