<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 64" width="54" height="64">
  <defs>
    <linearGradient id="fridgeFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="canCola" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="canSprite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="canEnergy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="2" y="58" width="50" height="5" rx="2" fill="#090D14" opacity="0.4"/>

  <!-- Cabinet Body -->
  <rect x="2" y="2" width="50" height="58" rx="4" fill="url(#fridgeFrame)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Lightbox Brand (Cold Drinks) -->
  <rect x="5" y="4" width="44" height="8" rx="2" fill="#0284C7"/>
  <text x="27" y="10" font-family="sans-serif" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">COLD BAR</text>

  <!-- Inside Chamber (Dark Interior with LED glow) -->
  <rect x="5" y="13" width="44" height="44" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1"/>

  <!-- Top Shelf Wire Rack -->
  <line x1="5" y1="28" x2="49" y2="28" stroke="#94A3B8" stroke-width="1"/>
  <!-- Top Shelf Cans -->
  <rect x="8" y="17" width="6" height="11" rx="1.5" fill="url(#canCola)"/>
  <rect x="16" y="17" width="6" height="11" rx="1.5" fill="url(#canSprite)"/>
  <rect x="24" y="17" width="6" height="11" rx="1.5" fill="url(#canCola)"/>
  <rect x="32" y="17" width="6" height="11" rx="1.5" fill="url(#canEnergy)"/>
  <rect x="40" y="17" width="6" height="11" rx="1.5" fill="url(#canSprite)"/>

  <!-- Bottom Shelf Wire Rack -->
  <line x1="5" y1="44" x2="49" y2="44" stroke="#94A3B8" stroke-width="1"/>
  <!-- Bottom Shelf Cans / Bottles -->
  <rect x="8" y="32" width="6" height="12" rx="1.5" fill="url(#canEnergy)"/>
  <rect x="16" y="32" width="6" height="12" rx="1.5" fill="url(#canCola)"/>
  <rect x="24" y="32" width="6" height="12" rx="1.5" fill="url(#canSprite)"/>
  <rect x="32" y="32" width="6" height="12" rx="1.5" fill="url(#canCola)"/>
  <rect x="40" y="32" width="6" height="12" rx="1.5" fill="url(#canEnergy)"/>

  <!-- Glass Door Reflection Overlay -->
  <rect x="5" y="13" width="44" height="44" rx="2" fill="url(#glassReflection)"/>
  
  <!-- Diagonal Glass Glare Line -->
  <polygon points="12,14 18,14 38,56 32,56" fill="#FFFFFF" opacity="0.12"/>

  <!-- Chrome Door Handle -->
  <rect x="44" y="24" width="3" height="18" rx="1.5" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8"/>
</svg>
