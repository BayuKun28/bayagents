<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" width="120" height="48">
  <defs>
    <!-- Sky Gradient: Twilight Cityscape -->
    <linearGradient id="skyTwilight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Window Frame Border -->
  <rect x="1" y="1" width="118" height="46" rx="2" fill="#090D16" stroke="#334155" stroke-width="1.5"/>

  <!-- Outside Sky View -->
  <rect x="3" y="3" width="114" height="42" fill="url(#skyTwilight)"/>

  <!-- Background Distant Skyline Silhouettes -->
  <rect x="6" y="24" width="12" height="21" fill="#182232"/>
  <rect x="15" y="18" width="14" height="27" fill="#0F172A"/>
  <!-- Spire Tower -->
  <rect x="21" y="12" width="2" height="6" fill="#38BDF8"/>
  <polygon points="20,18 22,12 24,18" fill="#0F172A"/>
  
  <rect x="32" y="22" width="10" height="23" fill="#1E293B"/>
  <rect x="44" y="14" width="16" height="31" fill="#0F172A"/>
  <!-- Antenna on main tower -->
  <line x1="52" y1="9" x2="52" y2="14" stroke="#EF4444" stroke-width="0.8"/>
  <circle cx="52" cy="9" r="0.8" fill="#EF4444"/>

  <rect x="63" y="20" width="12" height="25" fill="#182232"/>
  <rect x="78" y="16" width="15" height="29" fill="#0F172A"/>
  <polygon points="78,16 85.5,10 93,16" fill="#1E293B"/>

  <rect x="96" y="23" width="11" height="22" fill="#182232"/>
  <rect x="105" y="19" width="10" height="26" fill="#0F172A"/>

  <!-- Skyscraper Tiny Lit Windows (Golden & Cyan Office Glows) -->
  <!-- Tower 1 -->
  <circle cx="18" cy="22" r="0.6" fill="#FDE047"/>
  <circle cx="21" cy="22" r="0.6" fill="#FDE047"/>
  <circle cx="24" cy="22" r="0.6" fill="#38BDF8"/>
  <circle cx="18" cy="26" r="0.6" fill="#FDE047"/>
  <circle cx="24" cy="26" r="0.6" fill="#FDE047"/>
  <circle cx="21" cy="30" r="0.6" fill="#FDE047"/>

  <!-- Tower 2 (Center Big Tower) -->
  <circle cx="47" cy="18" r="0.6" fill="#38BDF8"/>
  <circle cx="50" cy="18" r="0.6" fill="#FDE047"/>
  <circle cx="53" cy="18" r="0.6" fill="#FDE047"/>
  <circle cx="56" cy="18" r="0.6" fill="#38BDF8"/>
  <circle cx="47" cy="22" r="0.6" fill="#FDE047"/>
  <circle cx="53" cy="22" r="0.6" fill="#FDE047"/>
  <circle cx="50" cy="26" r="0.6" fill="#FDE047"/>
  <circle cx="56" cy="26" r="0.6" fill="#FDE047"/>
  <circle cx="47" cy="30" r="0.6" fill="#38BDF8"/>
  <circle cx="53" cy="30" r="0.6" fill="#FDE047"/>

  <!-- Tower 3 (Right Tower) -->
  <circle cx="81" cy="20" r="0.6" fill="#FDE047"/>
  <circle cx="85" cy="20" r="0.6" fill="#38BDF8"/>
  <circle cx="88" cy="20" r="0.6" fill="#FDE047"/>
  <circle cx="81" cy="25" r="0.6" fill="#FDE047"/>
  <circle cx="85" cy="25" r="0.6" fill="#FDE047"/>
  <circle cx="88" cy="25" r="0.6" fill="#38BDF8"/>

  <!-- Glass Sheen Glare Effect -->
  <rect x="3" y="3" width="114" height="42" fill="url(#glassSheen)"/>
  <polygon points="12,3 28,3 8,45 3,45" fill="#FFFFFF" opacity="0.12"/>
  <polygon points="55,3 70,3 45,45 35,45" fill="#FFFFFF" opacity="0.08"/>

  <!-- Window Muntin Mullions (Kusen Pembagi Kaca Modern) -->
  <line x1="41" y1="3" x2="41" y2="45" stroke="#1E293B" stroke-width="1.8"/>
  <line x1="79" y1="3" x2="79" y2="45" stroke="#1E293B" stroke-width="1.8"/>
  <line x1="3" y1="24" x2="117" y2="24" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Interior Window Sill (Ambang Jendela Bawah) -->
  <rect x="2" y="44" width="116" height="3" rx="0.5" fill="#475569" stroke="#1E293B" stroke-width="0.8"/>
</svg>
