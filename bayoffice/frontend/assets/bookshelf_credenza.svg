<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 36" width="100" height="36">
  <defs>
    <linearGradient id="credenzaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#2D1102"/>
      <stop offset="100%" stop-color="#190901"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <rect x="2" y="32" width="96" height="4" rx="2" fill="#090D14" opacity="0.4"/>

  <!-- Cabinet Body -->
  <rect x="2" y="4" width="96" height="30" rx="3" fill="url(#credenzaWood)" stroke="#190901" stroke-width="1.2"/>
  <line x1="2" y1="6" x2="98" y2="6" stroke="#78350F" stroke-width="1" opacity="0.6"/>

  <!-- Middle Shelf Divider -->
  <line x1="3" y1="20" x2="97" y2="20" stroke="#78350F" stroke-width="1.5"/>
  <line x1="50" y1="20" x2="50" y2="34" stroke="#78350F" stroke-width="1.5"/>

  <!-- Top Shelf Items -->
  <!-- 1. Golden Trophy Cup (Sprint Champion) -->
  <polygon points="12,18 18,18 20,12 10,12" fill="url(#goldTrophy)"/>
  <rect x="13.5" y="18" width="3" height="1.5" fill="#B45309"/>
  <rect x="12" y="19.5" width="6" height="0.8" fill="#F59E0B"/>
  <circle cx="15" cy="11" r="1.5" fill="#FEF08A"/>

  <!-- 2. Leather-Bound Encyclopedia Books (Set of 6) -->
  <rect x="26" y="8" width="3" height="12" rx="0.5" fill="#DC2626"/>
  <line x1="27.5" y1="10" x2="27.5" y2="18" stroke="#FDE047" stroke-width="0.6"/>
  
  <rect x="30" y="7" width="3.5" height="13" rx="0.5" fill="#2563EB"/>
  <line x1="31.7" y1="9" x2="31.7" y2="18" stroke="#FFFFFF" stroke-width="0.6"/>

  <rect x="34.5" y="9" width="3" height="11" rx="0.5" fill="#059669"/>
  <rect x="38.5" y="8" width="3.5" height="12" rx="0.5" fill="#D97706"/>
  <rect x="43" y="10" width="4" height="10" rx="0.5" fill="#7C3AED"/>

  <!-- 3. Mini Potted Succulent Plant on Top Shelf -->
  <rect x="58" y="14" width="7" height="6" rx="1" fill="#EA580C"/>
  <circle cx="61.5" cy="12" r="3" fill="#16A34A"/>
  <circle cx="61.5" cy="10" r="2" fill="#22C55E"/>

  <!-- 4. Framed ISO/AI Quality Certificate -->
  <rect x="74" y="8" width="16" height="11" rx="1" fill="#FEF3C7" stroke="url(#goldTrophy)" stroke-width="1"/>
  <line x1="77" y1="11" x2="87" y2="11" stroke="#92400E" stroke-width="0.8"/>
  <line x1="77" y1="14" x2="85" y2="14" stroke="#92400E" stroke-width="0.6"/>
  <circle cx="82" cy="16.5" r="1" fill="#DC2626"/>

  <!-- Lower Shelf: Document Archive Binders -->
  <!-- Left Side Binders -->
  <rect x="8" y="22" width="6" height="11" rx="0.5" fill="#475569" stroke="#334155" stroke-width="0.5"/>
  <circle cx="11" cy="27" r="0.8" fill="#CBD5E1"/>
  <rect x="15" y="22" width="6" height="11" rx="0.5" fill="#475569" stroke="#334155" stroke-width="0.5"/>
  <circle cx="18" cy="27" r="0.8" fill="#CBD5E1"/>
  <rect x="22" y="22" width="6" height="11" rx="0.5" fill="#0284C7" stroke="#0369A1" stroke-width="0.5"/>
  <circle cx="25" cy="27" r="0.8" fill="#BAE6FD"/>

  <!-- Right Side Cabinet Door (Oak Slats with Brass Handle) -->
  <rect x="54" y="22" width="40" height="11" rx="1" fill="#2D1102" stroke="#451A03" stroke-width="0.8"/>
  <circle cx="58" cy="27" r="1.2" fill="url(#goldTrophy)"/>
  <circle cx="90" cy="27" r="1.2" fill="url(#goldTrophy)"/>
</svg>
