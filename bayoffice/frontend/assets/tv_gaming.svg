<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 52" width="96" height="52">
  <defs>
    <!-- Screen Cyberpunk Gradient -->
    <linearGradient id="cyberScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D946EF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Wall Glow -->
  <rect x="6" y="4" width="84" height="42" rx="4" fill="#D946EF" opacity="0.25" filter="url(#neonGlow)"/>

  <!-- TV Thin Bezel Outer Frame -->
  <rect x="4" y="2" width="88" height="46" rx="3" fill="#020617" stroke="#334155" stroke-width="1.2"/>

  <!-- Active OLED Screen -->
  <rect x="6" y="4" width="84" height="42" rx="1.5" fill="url(#cyberScreen)"/>

  <!-- Game / Cyber HUD Visuals -->
  <!-- Top HUD Bar -->
  <rect x="10" y="7" width="24" height="3" rx="1" fill="#38BDF8" opacity="0.8"/>
  <rect x="36" y="7" width="8" height="3" rx="1" fill="#EF4444" opacity="0.8"/>
  <text x="78" y="10" font-family="monospace" font-size="3.5" font-weight="bold" fill="#FACC15">FPS 120</text>

  <!-- Center Graphic: Retro Synthwave Grid Sun -->
  <circle cx="48" cy="24" r="9" fill="#F43F5E"/>
  <line x1="39" y1="21" x2="57" y2="21" stroke="#1E1B4B" stroke-width="1"/>
  <line x1="40" y1="24" x2="56" y2="24" stroke="#1E1B4B" stroke-width="1.2"/>
  <line x1="42" y1="27" x2="54" y2="27" stroke="#1E1B4B" stroke-width="1.5"/>

  <!-- Neon Horizon & Wireframe Mountains -->
  <polygon points="12,34 32,22 48,34" fill="none" stroke="#06B6D4" stroke-width="1"/>
  <polygon points="44,34 62,20 84,34" fill="none" stroke="#A855F7" stroke-width="1"/>
  <line x1="8" y1="34" x2="88" y2="34" stroke="#D946EF" stroke-width="1.2"/>

  <!-- Grid Perspective Lines -->
  <line x1="48" y1="34" x2="16" y2="44" stroke="#06B6D4" stroke-width="0.8" opacity="0.7"/>
  <line x1="48" y1="34" x2="36" y2="44" stroke="#06B6D4" stroke-width="0.8" opacity="0.7"/>
  <line x1="48" y1="34" x2="60" y2="44" stroke="#06B6D4" stroke-width="0.8" opacity="0.7"/>
  <line x1="48" y1="34" x2="80" y2="44" stroke="#06B6D4" stroke-width="0.8" opacity="0.7"/>

  <!-- TV Status Indicator Dot (Green LED) -->
  <circle cx="48" cy="47.2" r="0.8" fill="#22C55E"/>
</svg>
