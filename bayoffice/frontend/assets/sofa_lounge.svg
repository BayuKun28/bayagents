<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" width="120" height="56">
  <defs>
    <!-- Leather Gradient -->
    <linearGradient id="sofaLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="cushionTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <rect x="6" y="8" width="108" height="46" rx="8" fill="#090D14" opacity="0.35"/>

  <!-- Sofa Backrest Frame -->
  <rect x="4" y="6" width="112" height="24" rx="6" fill="url(#sofaLeather)" stroke="#451A03" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Backrest Tufting Stitch Accents -->
  <circle cx="20" cy="18" r="1.5" fill="#451A03"/>
  <circle cx="36" cy="18" r="1.5" fill="#451A03"/>
  <circle cx="52" cy="18" r="1.5" fill="#451A03"/>
  <circle cx="68" cy="18" r="1.5" fill="#451A03"/>
  <circle cx="84" cy="18" r="1.5" fill="#451A03"/>
  <circle cx="100" cy="18" r="1.5" fill="#451A03"/>

  <!-- Left Armrest -->
  <rect x="2" y="16" width="16" height="34" rx="5" fill="url(#sofaLeather)" stroke="#451A03" stroke-width="1.5"/>
  <line x1="6" y1="18" x2="6" y2="48" stroke="#FDE68A" stroke-width="1" opacity="0.4"/>

  <!-- Right Armrest -->
  <rect x="102" y="16" width="16" height="34" rx="5" fill="url(#sofaLeather)" stroke="#451A03" stroke-width="1.5"/>
  <line x1="114" y1="18" x2="114" y2="48" stroke="#FDE68A" stroke-width="1" opacity="0.4"/>

  <!-- Seat Cushions (3 Section Cushions) -->
  <!-- Cushion 1 -->
  <rect x="19" y="24" width="26" height="26" rx="4" fill="url(#cushionTop)" stroke="#92400E" stroke-width="1.2"/>
  <line x1="21" y1="26" x2="43" y2="26" stroke="#FEF3C7" stroke-width="1" opacity="0.6"/>
  
  <!-- Cushion 2 -->
  <rect x="47" y="24" width="26" height="26" rx="4" fill="url(#cushionTop)" stroke="#92400E" stroke-width="1.2"/>
  <line x1="49" y1="26" x2="71" y2="26" stroke="#FEF3C7" stroke-width="1" opacity="0.6"/>

  <!-- Cushion 3 -->
  <rect x="75" y="24" width="26" height="26" rx="4" fill="url(#cushionTop)" stroke="#92400E" stroke-width="1.2"/>
  <line x1="77" y1="26" x2="99" y2="26" stroke="#FEF3C7" stroke-width="1" opacity="0.6"/>

  <!-- Decorative Accent Pillow on Left -->
  <rect x="20" y="26" width="12" height="12" rx="2" transform="rotate(-12 26 32)" fill="url(#pillowGrad)" stroke="#4C1D95" stroke-width="1"/>
</svg>
