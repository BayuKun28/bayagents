<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="seatContour" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="meshBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow under 5-star base -->
  <circle cx="24" cy="30" r="16" fill="#090D14" opacity="0.35"/>

  <!-- 5-Star Wheel Base (Bintang 5 Roda Castor) -->
  <g stroke="#0F172A" stroke-width="2" stroke-linecap="round">
    <line x1="24" y1="28" x2="24" y2="40"/>
    <line x1="24" y1="28" x2="35" y2="35"/>
    <line x1="24" y1="28" x2="31" y2="20"/>
    <line x1="24" y1="28" x2="17" y2="20"/>
    <line x1="24" y1="28" x2="13" y2="35"/>
  </g>
  <!-- Castor Wheel Caps -->
  <circle cx="24" cy="40" r="2" fill="#334155"/>
  <circle cx="35" cy="35" r="2" fill="#334155"/>
  <circle cx="31" cy="20" r="2" fill="#334155"/>
  <circle cx="17" cy="20" r="2" fill="#334155"/>
  <circle cx="13" cy="35" r="2" fill="#334155"/>

  <!-- Center Gas Lift Cylinder -->
  <circle cx="24" cy="28" r="4" fill="url(#chromeAccent)"/>

  <!-- Ergonomic Mesh Backrest (Melengkung di atas) -->
  <path d="M 12,18 C 12,8 36,8 36,18 L 34,22 C 34,14 14,14 14,22 Z" fill="url(#meshBack)" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Lumbar Support Strip -->
  <path d="M 14,15 Q 24,18 34,15" fill="none" stroke="url(#chromeAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Armrest 3D -->
  <rect x="7" y="18" width="5" height="12" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
  <rect x="8" y="19" width="3" height="10" rx="1.5" fill="#475569"/>
  <!-- Armrest connecting bracket -->
  <path d="M 11,26 L 15,26" stroke="url(#chromeAccent)" stroke-width="1.5"/>

  <!-- Right Armrest 3D -->
  <rect x="36" y="18" width="5" height="12" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
  <rect x="37" y="19" width="3" height="10" rx="1.5" fill="#475569"/>
  <!-- Armrest connecting bracket -->
  <path d="M 37,26 L 33,26" stroke="url(#chromeAccent)" stroke-width="1.5"/>

  <!-- Seat Pan (Dudukan Busa Berkontur) -->
  <ellipse cx="24" cy="25" rx="11" ry="8" fill="url(#seatContour)" stroke="#0F172A" stroke-width="1.2"/>
  <ellipse cx="24" cy="24" rx="8" ry="5.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
</svg>
