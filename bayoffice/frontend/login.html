<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">BayOffice — Virtual Workspace AI Agents</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23FFDE59%22 stroke-width=%222%22><rect width=%2216%22 height=%2220%22 x=%224%22 y=%222%22 rx=%222%22/><path d=%22M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01%22/></svg>">
  <link rel="stylesheet" href="/static/css/style.css?v=20261029_01">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #EAE6DF;
      background-image: radial-gradient(#D5CFC5 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: #FFFFFF;
      position: relative;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 3px solid #1A1A1A;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      background: #FDFBF7;
      box-shadow: 3px 3px 0px #1A1A1A;
      outline: none;
      transition: all 0.15s ease;
    }
    .form-input:focus {
      background: #FFFFFF;
      box-shadow: 4px 4px 0px #FFDE59;
    }
    .error-box {
      display: none;
      padding: 12px;
      background: #FFE2E2;
      border: 2px solid #FF6B6B;
      color: #991B1B;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .login-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="neo-box login-card">
    <div class="login-top-bar">
      <button id="langToggle" class="neo-btn neo-btn-secondary" style="padding: 4px 10px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; gap: 5px;" data-i18n-title="actions.lang_toggle" title="Switch Language (EN / ID)">
        <i data-lucide="languages" style="width: 14px; height: 14px;"></i>
        <span id="langLabel">EN</span>
      </button>
    </div>

    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; background: #FFDE59; border: 3px solid #1A1A1A; box-shadow: 4px 4px 0px #1A1A1A; padding: 12px 18px; border-radius: 12px; margin-bottom: 14px;">
        <i data-lucide="building-2" style="width: 2.2rem; height: 2.2rem; stroke-width: 2.5px; color: #1A1A1A;"></i>
      </div>
      <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px;">BayOffice</h1>
      <p style="color: #64748B; font-size: 0.9rem; font-weight: 600; margin-top: 4px;" data-i18n="login.subtitle">
        Virtual Workspace for 4 AI Agents
      </p>
      <div style="margin-top: 8px;">
        <span class="neo-badge badge-done" style="font-size: 0.7rem;" data-i18n="login.secured_badge">Port 8888 • Secured</span>
      </div>
    </div>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username" data-i18n="login.username_label">Username</label>
        <input class="form-input" type="text" id="username" placeholder="Enter username" data-i18n-placeholder="login.username_placeholder" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password" data-i18n="login.password_label">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" data-i18n-placeholder="login.password_placeholder" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="neo-btn neo-btn-primary" style="width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 8px;">
        <span data-i18n="login.submit_btn">Enter Office</span> ➔
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: #94A3B8; font-weight: 600;" data-i18n="login.orchestrator_footer">
      Orchestrators: LUHUT • JOKOWI • PRABOWO • GIBRAN
    </div>
  </div>

  <script src="/static/js/lucide.min.js"></script>
  <script src="/static/js/i18n.js?v=20261029_01"></script>
  <script>
    if (window.I18n) {
      window.I18n.init();
    }
    if (window.lucide) window.lucide.createIcons();

    const langToggle = document.getElementById('langToggle');
    if (langToggle && window.I18n) {
      langToggle.addEventListener('click', () => {
        window.I18n.toggleLanguage();
        if (window.lucide) window.lucide.createIcons();
      });
    }

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      const verifyingText = window.I18n ? window.I18n.t('login.verifying') : 'Verifying...';
      const enterOfficeText = window.I18n ? window.I18n.t('login.submit_btn') : 'Enter Office';
      submitBtn.innerHTML = `<span>${verifyingText}</span>`;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          errorBox.textContent = data.message || (window.I18n ? window.I18n.t('login.invalid_credentials') : 'Incorrect username or password.');
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>${enterOfficeText}</span> ➔`;
        }
      } catch (err) {
        errorBox.textContent = window.I18n ? window.I18n.t('login.conn_error') : 'Failed to connect to BayOffice server.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${enterOfficeText}</span> ➔`;
      }
    });
  </script>
</body>
</html>
